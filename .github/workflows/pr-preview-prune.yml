name: Prune stale PR previews

# Safety net: deletes any Cloudflare Pages preview deployment older than 7
# days, in case a PR's own cleanup (pr-preview-cleanup.yml) never ran — e.g.
# the branch was deleted, the workflow was cancelled, or the repo's cleanup
# workflow config changed after the preview was created.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Delete preview deployments older than 7 days
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: merkleye-website
        run: .github/scripts/prune-cf-pages-previews.sh --max-age-days 7
