# Safety net: deletes any Cloudflare Pages preview deployment older than 7
# days, in case a PR's own cleanup (pr-preview-cleanup.yml) never ran — e.g.
# the branch was deleted, the workflow was cancelled, or the repo's cleanup
# workflow config changed after the preview was created.
#
# Production deployments are never candidates: the shared prune action
# filters to preview-environment deployments before it deletes anything.
name: Prune stale PR previews

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    permissions:
      contents: read
    uses: Merkleye/github-templates/.github/workflows/cf-pages-preview-prune.yml@main
    with:
      project-name: merkleye-website
      max-age-days: 7
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
