name: PR Preview Cleanup

# Deletes the Cloudflare Pages preview deployment(s) for a PR's branch as
# soon as the PR closes (merged or not), and updates the preview comment to
# note when it was deleted. The scheduled prune workflow
# (pr-preview-prune.yml) is the safety net for previews that slip past this,
# e.g. if the branch was force-deleted before this event fired.

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Delete preview deployment for this PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: merkleye-website
        run: .github/scripts/prune-cf-pages-previews.sh --branch "pr-${{ github.event.pull_request.number }}"

      - name: Record deletion time
        id: deleted-at
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Update preview comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          message: |
            The preview site was deleted on ${{ steps.deleted-at.outputs.timestamp }}.
