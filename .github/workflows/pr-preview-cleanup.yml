# Deletes the Cloudflare Pages preview deployment(s) for a PR's branch as
# soon as the PR closes (merged or not), and updates the preview comment to
# note when it was deleted. The scheduled prune workflow
# (pr-preview-prune.yml) is the safety net for previews that slip past this,
# e.g. if the branch was force-deleted before this event fired.
#
# The deletion logic lives in Merkleye/github-templates — the script this
# used to call was byte-for-byte identical to the one in Merkleye/design.
name: PR Preview Cleanup

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  cleanup:
    # Matches the permissions the called job requests. A called workflow can
    # narrow the token but never widen it, so these have to be granted here.
    permissions:
      contents: read
      pull-requests: write
    uses: Merkleye/github-templates/.github/workflows/cf-pages-preview-cleanup.yml@v1
    with:
      project-name: merkleye-website
      comment-message: The preview site was deleted on {timestamp}.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
