name: Build site
description: >
  Set up the toolchain via mise, install npm dependencies (cached), and build
  the Astro site into dist/. Callers must check out the repo first — a local
  composite action can only be resolved after its own repo is on disk.

inputs:
  npm-token:
    description: >
      Read-only GitHub token for npm.pkg.github.com, used to install
      @merkleye/design-tokens from the private Merkleye/design repo. The
      workflow's own GITHUB_TOKEN can't read packages from a different
      repo, so this must be a PAT with read:packages + access to
      Merkleye/design, passed in by the caller as a secret.
    required: true

runs:
  using: composite
  steps:
    # Utilize mise for CI and local
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - run: npm ci
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}

    - run: npm run build
      shell: bash
