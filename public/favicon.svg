<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outline, .root { stroke: #35d0c0; fill: #35d0c0; }
    .edge   { stroke: #5c7078; }
    .node   { fill: #1c8f85; }
    .leaf   { fill: #8fa1ab; }
    @media (prefers-color-scheme: light) {
      .outline, .root { stroke: #0f9c8c; fill: #0f9c8c; }
      .edge   { stroke: #55666e; }
      .node   { fill: #0a7568; }
      .leaf   { fill: #3f4f57; }
    }
  </style>

  <path class="outline" d="M28,100 Q100,44 172,100 Q100,156 28,100 Z"
        fill="none" stroke-width="7" stroke-linejoin="round"/>

  <g class="edge" stroke-width="2.6" fill="none">
    <line x1="81.6" y1="114.2" x2="90.8" y2="98.1"/>
    <line x1="100" y1="114.2" x2="90.8" y2="98.1"/>
    <line x1="90.8" y1="98.1" x2="104.6" y2="82"/>
    <line x1="118.4" y1="114.2" x2="104.6" y2="82"/>
  </g>

  <circle class="root" cx="104.6" cy="82" r="4.6"/>
  <circle class="node" cx="90.8" cy="98.1" r="3.7"/>
  <circle class="leaf" cx="81.6" cy="114.2" r="3.7"/>
  <circle class="leaf" cx="100" cy="114.2" r="3.7"/>
  <circle class="leaf" cx="118.4" cy="114.2" r="3.7"/>
</svg>
